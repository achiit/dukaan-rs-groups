<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RS Group | One-Stop Solution for Life’s Milestones</title>
    <!-- Google Fonts for Luxury Aesthetic -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        /* Modern CSS Variables for Branding */
        :root {
            --bg-dark: #0f1115;
            --bg-card: #181c24;
            --gold-primary: #d4af37;
            --gold-light: #f3e5ab;
            --gold-gradient: linear-gradient(135deg, #b38728 0%, #fbf5b7 50%, #996515 100%);
            --text-light: #ffffff;
            --text-gray: #a0a5b5;
            --transition: all 0.3s ease;
        }

        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Typography Utilities */
        h1, h2, h3, .brand-logo {
            font-family: 'Cinzel', serif;
            letter-spacing: 2px;
        }

        .gold-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        /* Navigation Bar */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(15, 17, 21, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .brand-logo {
            font-size: 1.5rem;
            text-decoration: none;
            color: var(--text-light);
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .nav-links a {
            color: var(--text-light);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: var(--transition);
        }

        .nav-links a:hover {
            color: var(--gold-primary);
        }

        .nav-btn {
            background: var(--gold-gradient);
            color: #000 !important;
            padding: 8px 20px;
            border-radius: 4px;
            font-weight: 700 !important;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 120px 20px 60px 20px;
            position: relative;
            background: radial-gradient(circle at center, rgba(40, 48, 68, 0.5) 0%, rgba(15, 17, 21, 1) 70%);
        }

        .hero-content {
            max-width: 900px;
            z-index: 10;
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--text-gray);
            margin-bottom: 40px;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
        }

        .cta-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 35px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            text-decoration: none;
            letter-spacing: 1px;
            border-radius: 4px;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--gold-gradient);
            color: #000;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5);
        }

        .btn-secondary {
            border: 1px solid var(--gold-primary);
            color: var(--text-light);
        }

        .btn-secondary:hover {
            background-color: rgba(212, 175, 55, 0.1);
            transform: translateY(-3px);
        }

        /* Section Global Settings */
        section {
            padding: 100px 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .section-header {
            text-align: center;
            margin-bottom: 60px;
        }

        .section-header h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            position: relative;
            display: inline-block;
        }

        .section-header h2::after {
            content: '';
            display: block;
            width: 60px;
            height: 2px;
            background: var(--gold-gradient);
            margin: 10px auto 0 auto;
        }

        /* Divisions Grid Layout */
        .divisions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
            gap: 30px;
        }

        .division-card {
            background-color: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 40px 30px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .division-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--gold-gradient);
            transform: scaleX(0);
            transition: var(--transition);
        }

        .division-card:hover {
            transform: translateY(-10px);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .division-card:hover::before {
            transform: scaleX(1);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 25px;
            color: var(--gold-primary);
        }

        .division-card h3 {
            font-size: 1.4rem;
            margin-bottom: 15px;
        }

        .division-card p {
            color: var(--text-gray);
            font-size: 0.95rem;
        }

        /* Founder Profile Section */
        .founder-wrapper {
            display: flex;
            align-items: center;
            gap: 60px;
            background-color: var(--bg-card);
            padding: 50px;
            border-radius: 12px;
            border: 1px solid rgba(212, 175, 55, 0.1);
        }

        .founder-img-box {
            flex: 1;
            max-width: 400px;
            border: 4px solid transparent;
            background-image: linear-gradient(var(--bg-card), var(--bg-card)), var(--gold-gradient);
            background-origin: border-box;
            background-clip: content-box, border-box;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .founder-img-box img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            filter: grayscale(10%);
        }

        .founder-details {
            flex: 1.5;
        }

        .founder-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--gold-primary);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .founder-details h3 {
            font-size: 2.2rem;
            margin-bottom: 20px;
        }

        .founder-details p {
            color: var(--text-gray);
            margin-bottom: 25px;
            font-size: 1.05rem;
        }

        /* Quick Features Strip */
        .highlights-strip {
            background-color: rgba(24, 28, 36, 0.7);
            border-top: 1px solid rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding: 40px 20px;
            text-align: center;
            margin: 40px auto;
        }

        .highlights-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 30px;
        }

        .highlight-item {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .highlight-item i {
            color: var(--gold-primary);
        }

        /* Action Footer Banner */
        .contact-banner {
            background: linear-gradient(rgba(15,17,21,0.9), rgba(15,17,21,0.9)), radial-gradient(circle, rgba(179,135,40,0.2) 0%, rgba(15,17,21,0) 80%);
            text-align: center;
